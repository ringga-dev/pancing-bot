name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Bangun situs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Pasang dependensi
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validasi dokumen
        run: python3 scripts/check_docs.py

      - name: Bangun dengan MkDocs
        run: python3 -m mkdocs build --strict

      - name: Unggah artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
